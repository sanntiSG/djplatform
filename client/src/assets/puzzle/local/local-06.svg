<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#08080f"/>
  <!-- Concentric circles expanding to fill all 9 puzzle zones -->
  <circle cx="400" cy="400" r="20" fill="none" stroke="#8a2be2" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="400" r="55" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.75"/>
  <circle cx="400" cy="400" r="100" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.65"/>
  <circle cx="400" cy="400" r="155" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.55"/>
  <circle cx="400" cy="400" r="215" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.45"/>
  <circle cx="400" cy="400" r="280" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.35"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.25"/>
  <circle cx="400" cy="400" r="430" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.18"/>
  <circle cx="400" cy="400" r="520" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.12"/>
  <circle cx="400" cy="400" r="620" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.08"/>
  <!-- Center dot -->
  <circle cx="400" cy="400" r="6" fill="#b060ff" opacity="0.95"/>
  <!-- Crosshair -->
  <line x1="400" y1="0" x2="400" y2="800" stroke="#8a2be2" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#8a2be2" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Corner accent lines -->
  <line x1="0" y1="0" x2="60" y2="60" stroke="#8a2be2" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="800" y1="0" x2="740" y2="60" stroke="#8a2be2" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="0" y1="800" x2="60" y2="740" stroke="#8a2be2" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="800" y1="800" x2="740" y2="740" stroke="#8a2be2" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
