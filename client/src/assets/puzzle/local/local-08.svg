<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#08080f"/>
  <!-- Diagonal stripe pattern covering entire canvas -->
  <g stroke="#00f5ff" stroke-width="1" stroke-opacity="0.12">
    <line x1="-400" y1="0" x2="400" y2="800"/>
    <line x1="-320" y1="0" x2="480" y2="800"/>
    <line x1="-240" y1="0" x2="560" y2="800"/>
    <line x1="-160" y1="0" x2="640" y2="800"/>
    <line x1="-80" y1="0" x2="720" y2="800"/>
    <line x1="0" y1="0" x2="800" y2="800"/>
    <line x1="80" y1="0" x2="880" y2="800"/>
    <line x1="160" y1="0" x2="960" y2="800"/>
    <line x1="240" y1="0" x2="1040" y2="800"/>
    <line x1="320" y1="0" x2="1120" y2="800"/>
    <line x1="400" y1="0" x2="1200" y2="800"/>
    <line x1="480" y1="0" x2="1280" y2="800"/>
    <line x1="560" y1="0" x2="1360" y2="800"/>
    <line x1="640" y1="0" x2="1440" y2="800"/>
    <line x1="720" y1="0" x2="1520" y2="800"/>
  </g>
  <g stroke="#00f5ff" stroke-width="1" stroke-opacity="0.12">
    <line x1="1200" y1="0" x2="400" y2="800"/>
    <line x1="1120" y1="0" x2="320" y2="800"/>
    <line x1="1040" y1="0" x2="240" y2="800"/>
    <line x1="960" y1="0" x2="160" y2="800"/>
    <line x1="880" y1="0" x2="80" y2="800"/>
    <line x1="800" y1="0" x2="0" y2="800"/>
    <line x1="720" y1="0" x2="-80" y2="800"/>
    <line x1="640" y1="0" x2="-160" y2="800"/>
    <line x1="560" y1="0" x2="-240" y2="800"/>
    <line x1="480" y1="0" x2="-320" y2="800"/>
    <line x1="400" y1="0" x2="-400" y2="800"/>
  </g>
  <!-- Highlight intersection points -->
  <circle cx="400" cy="400" r="8" fill="#00f5ff" opacity="0.7"/>
  <circle cx="200" cy="200" r="4" fill="#00f5ff" opacity="0.35"/>
  <circle cx="600" cy="200" r="4" fill="#00f5ff" opacity="0.35"/>
  <circle cx="200" cy="600" r="4" fill="#00f5ff" opacity="0.35"/>
  <circle cx="600" cy="600" r="4" fill="#00f5ff" opacity="0.35"/>
  <!-- Corner accents -->
  <circle cx="40" cy="40" r="5" fill="#00f5ff" opacity="0.25"/>
  <circle cx="760" cy="40" r="5" fill="#00f5ff" opacity="0.25"/>
  <circle cx="40" cy="760" r="5" fill="#00f5ff" opacity="0.25"/>
  <circle cx="760" cy="760" r="5" fill="#00f5ff" opacity="0.25"/>
</svg>
